[project]
name = "quanta-bot"
version = "0.1.0"
description = "QuantaCommunity AI 评论智能体（被动 @ 触发，四表达模式）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "redis>=5,<6",
    "langfuse>=4.7",
    "aio-pika>=9,<10",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quanta_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# docs/ 为中文计划文档：ruff>=0.16 对 markdown 代码块做格式化检查会按顶层代码
# 重排缩进（破坏文档排版），计划文档保持手写原样，不作为格式化对象
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/eval"]
# tests/eval 以包结构 import（from tests.eval._runner import ...）：rootdir 入 sys.path
# （不建 tests/__init__.py——避免扰动现有 tests/unit 无包结构，2026-09-17 Task 10 澄清 ③）
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: 需真实外部服务（QUANTABOT_INTEGRATION=1 且环境就绪才运行）",
    "persona: eval persona 档（QUANTABOT_EVAL=1 才运行，真调 DeepSeek）",
]
