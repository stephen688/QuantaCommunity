name: QuantaBot CI

on:
  push:
  pull_request:

# 同分支新推送取消旧运行（省 runner；M0 审查 Minor-3 清账）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 挂死保护：超 10 分钟判失败（M0 审查 Minor-3 清账）
    timeout-minutes: 10
    defaults:
      run:
        working-directory: QuantaBot
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # 显式锁定解释器：设 UV_PYTHON=3.12，后续 uv sync/run 一律用 uv 托管的 3.12
          #（覆盖 .python-version 与 runner 预装版本的不确定性，缺失时 uv 自动下载托管版）
          python-version: "3.12"
      - name: 安装依赖（按锁文件）
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Format 检查
        run: uv run ruff format --check src tests
      - name: 单测
        run: uv run pytest tests/unit -q
