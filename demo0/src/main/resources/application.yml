server:
  port: 9191
  tomcat:
    max-http-form-post-size: 10MB # 最大请求体大小
    max-swallow-size: 10MB

spring:

  # 项目只使用自定义JWT认证，不创建Spring Security默认账号和随机密码。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  profiles:
    include: ${SPRING_PROFILES_INCLUDE:local-secret}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/demo?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD}
  # redis192.168.100.128
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
  rabbitmq:
    host: 192.168.100.128
    port: 5672
    username: admin
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
    connection-timeout: 15000
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

  # Elasticsearch 配置
  elasticsearch:
    host: 192.168.100.128
    port: 9200
    scheme: http

  ai:
    openai:
      api-key:  ${OPENAI_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
          max-tokens: 2000
    qwen-openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key:  ${QWEN_API_KEY}
      embedding:
        options:
          model: text-embedding-v4

rag:
  enabled: true
  ai-enabled: true
  embedding:
    dimension: 1024
  vector:
    file-path: ./data/vector-store/content-vector-store.json
  retrieval:
    es-topk: 20
    vector-topk: 20
    final-topk: 10
  es-weight: 0.8
  vector-weight: 1.0
  summary-cache:
    enabled: true
    ttl-seconds: 1800
    normalize-case: true
  chunk:
    size: 500
    overlap: 100
    min-chars-for-chunking: 300
    max-chunks-per-doc: 64
mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.quanta.demo0.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
# 日志
logging:
  level:
    com:
      quanta:
        demo0:
         ai: debug
         mapper: info
         service: info
         controller: info
quanta:
  security:
    # 是否开放API接口文档，生产环境默认关闭（不设置或设为false）。
    # 本地开发需要调试接口文档时执行：API_DOCS_ENABLED=true
    api-docs-enabled: ${API_DOCS_ENABLED:false}
    cors:
      # 本地默认允许localhost和127.0.0.1的任意端口。
      # 生产环境通过CORS_ALLOWED_ORIGIN_PATTERNS配置真实前端域名。
      allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}"



  jwt:
    # 设置jwt签名加密时使用的秘钥
    user-secret-key: ${JWT_USER_SECRET_KEY}
    user-ttl: 604800000  # 7天 = 7×24×60×60×1000 毫秒
    user-token-name: authorization

    # 搜索热门发现配置
  search:
    trending:
        # 热门关键词数量
      keyword-limit: 10
        # 热门问题数量
      question-limit: 10
        # 热门校友数量
      alumni-limit: 10
        # 缓存过期时间（秒），默认 30 分钟
      cache-ttl: 1800
        # 是否在启动时重建粉丝排行（默认关闭，首次部署手动开启一次）
      rebuild-follower-rank-on-startup: false
  recommend:
    # Redis 推荐流为空时，启动后从 MySQL 已通过内容预热（dev-seed / Redis 清空后必开）
    warmup-on-startup: true
    warmup-batch-size: 100
  #阿里云
  alioss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${ALIOSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET}
    bucket-name: java-ai13580089828
  moderation:
    enabled: true                    # 总开关
    text-enabled: true               # 文本审核开关
    image-enabled: true              # 图片审核开关
    region-id: cn-shanghai           # 阿里云区域
    endpoint: green-cip.cn-shanghai.aliyuncs.com
    access-key-id: ${ALIYUN_ACCESS_KEY_ID}     # 环境变量
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET} # 环境变量
    auto-reject-enabled: true        # 自动驳回违规内容开关（即让ai直接拒绝，不进行手动审核）
    manual-on-suspect: true          # 疑似转人工审核开关（即当ai判断为疑似违规时，是否转人工人工审核）
    max-retry-count: 3               # 最大重试次数
    cost-control-enabled: true       # 成本控制开关
    targets: # 按内容类型配置
      content: # 帖子
        enabled: true
        disabled-policy: PENDING     # 关闭时转人工
      answer: # 回答
        enabled: true
        disabled-policy: PENDING     # 关闭时转人工
      comment: # 评论
        enabled: false               # 默认关闭省费用
        disabled-policy: APPROVED    # 关闭时敏感词通过后直接通过

  outbox:
    dispatch:
      # 每隔 1 秒扫描一次
      fixed-delay-ms: 1000
      # 一次最多抢占 50 条
      batch-size: 50
      # 一个实例拿到任务后，拥有 60 秒处理权
      lease-seconds: 60
      # 最多等待 RabbitMQ Confirm 5 秒
      confirm-timeout-seconds: 5
      # 第一次发送失败后，最多再重试 6 次
      max-retry-count: 6
      # 六次重试分别等待：
      # 5 秒、15 秒、1 分钟、5 分钟、15 分钟、30 分钟
      retry-delays-seconds:
        - 5
        - 15
        - 60
        - 300
        - 900
        - 1800
    maintenance:
      # 已完成事件保留 30 天；DEAD 和未完成 Inbox 不自动删除
      retention-days: 30
      # 最老的待发送事件超过 5 分钟时记录告警日志
      backlog-warning-seconds: 300
      monitor-fixed-delay-ms: 60000
      cleanup-cron: "0 30 3 * * ?"



  #微信 b4175a93096a7282fc72d329cce95c08   wx28b6b45cc07f4e99 。我的wx6af8baf31b0d42f4
  wechat:
    appid: wx6af8baf31b0d42f4
    secret: ${WECHAT_SECRET}
